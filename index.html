<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nomadik Security Sentinel</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 2rem;
            background-color: #0f172a;
            color: #f8fafc;
        }
        
        .dispatch-btn {
            background-color: #ef4444;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: background-color 0.2s ease;
        }
        
        .dispatch-btn:hover {
            background-color: #dc2626;
        }

        .dispatch-btn:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }

        #dispatchStatus {
            margin-top: 16px;
            font-weight: 500;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <h2>Active Defense Dashboard</h2>
    <p>Monitor and respond to security events across your infrastructure.</p>
    
    <button id="dispatchTeamBtn" class="dispatch-btn">Dispatch Response Team</button>
    <div id="dispatchStatus"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dispatchBtn = document.getElementById('dispatchTeamBtn');
            const statusDiv = document.getElementById('dispatchStatus');

            dispatchBtn.addEventListener('click', () => {
                dispatchBtn.disabled = true;
                dispatchBtn.innerText = 'Securing Checkout...';
                statusDiv.innerText = 'Routing to 4-Hour Rapid Emergency Response & Remediation...';
                statusDiv.style.color = '#38bdf8';

                window.location.href = 'https://buy.stripe.com/eVq8wObIaesHcAYbr1d7q05';
            });
        });
    </script>
</body>
</html>
