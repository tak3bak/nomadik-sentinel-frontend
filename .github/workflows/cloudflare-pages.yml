name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Validate Source
        run: |
          test -f index.html
          test -f package.json
          test -f package-lock.json

      - name: Build Project
        run: npm run build

      - name: Validate Cloudflare Output
        run: |
          test -d dist
          test -f dist/index.html
          echo "Cloudflare deployment directory:"
          find dist -maxdepth 2 -type f -print

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: nomadik-frontend
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main
