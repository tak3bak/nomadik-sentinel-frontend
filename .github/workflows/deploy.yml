name: Verify & Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build_and_deploy:
    name: Build & Verify Static Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Bundle Integrity
        run: |
          mkdir -p dist
          if [ ! -f dist/index.html ] && [ -f index.html ]; then
            cp index.html dist/index.html
          fi
          test -f index.html
          test -f vercel.json
          test -f dist/index.html
          test -f dist/_headers
          test -f dist/_redirects
          echo "Verified Vercel and Cloudflare static assets."
