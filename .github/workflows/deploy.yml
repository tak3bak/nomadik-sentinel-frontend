name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Validate Cloudflare Artifacts
        run: |
          test -d dist
          test -f dist/index.html
          test -f dist/_headers
          echo "[✓] Verified dist/_headers and dist/index.html exist."

      - name: Deploy to Cloudflare Pages via Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "[*] Deploying dist/ directory to Cloudflare Pages..."
          npx wrangler pages deploy dist --project-name="nomadik-frontend" --commit-dirty=true || \
          npx wrangler pages deploy dist --project-name="nomadik-sentinel" --commit-dirty=true
